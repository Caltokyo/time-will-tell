<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TWT / FIG. 006 — Map Preview</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#222;font:12px Arial,sans-serif}header{height:60px;padding:19px 20px;display:flex;justify-content:space-between;letter-spacing:.14em}#map{height:calc(100dvh - 116px);background:#e9ebe8}footer{height:56px;display:flex;align-items:center;gap:15px;padding:0 18px}button{border:1px solid #aaa;background:transparent;padding:9px 11px;font-size:11px}small{color:#777}.leaflet-container{background:#e9ebe8}</style></head><body><header><b>FIG. 006 / PLACES OF PRAYER</b><span>MAP STUDY</span></header><div id="map"></div><footer><button onclick="go(35.5,137,5)">JAPAN</button><button onclick="go(26.5,127.5,8)">OKINAWA</button><button onclick="go(24.8,125.3,11)">MIYAKO</button><small>Pinch to zoom</small></footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const m=L.map('map',{preferCanvas:true,zoomControl:false}).setView([35.5,137],5);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:18}).addTo(m);L.control.zoom({position:'topright'}).addTo(m);function go(a,b,z){m.flyTo([a,b],z,{duration:1})}const g=L.layerGroup().addTo(m);let timer;async function load(){if(m.getZoom()<8){g.clearLayers();return}let b=m.getBounds(),q='[out:json][timeout:25];(node["amenity"~"^(place_of_worship)$"]('+b.getSouth()+','+b.getWest()+','+b.getNorth()+','+b.getEast()+');node["name"~"御嶽|拝所|ウタキ|御願"]('+b.getSouth()+','+b.getWest()+','+b.getNorth()+','+b.getEast()+'););out center 3000;';try{let r=await fetch('https://overpass.kumi.systems/api/interpreter',{method:'POST',body:new URLSearchParams({data:q})});let d=await r.json();g.clearLayers();for(let p of d.elements){let n=p.tags?.name||'',red=/御嶽|拝所|ウタキ|御願/.test(n),color=red?'#c54835':'#336d9b';L.circleMarker([p.lat,p.lon],{radius:2,weight:0,fillOpacity:.9,fillColor:color}).addTo(g)}}catch(e){console.warn(e)}}m.on('moveend',()=>{clearTimeout(timer);timer=setTimeout(load,600)});load();let nationalPoints=[];const overlay=document.createElement('canvas');overlay.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:450';m.getContainer().appendChild(overlay);function redraw(){const w=m.getSize();const d=window.devicePixelRatio||1;overlay.width=w.x*d;overlay.height=w.y*d;overlay.style.width=w.x+'px';overlay.style.height=w.y+'px';const c=overlay.getContext('2d');c.scale(d,d);c.fillStyle='#336d9b';for(let i=0;i<nationalPoints.length;i+=2){const p=m.latLngToContainerPoint([nationalPoints[i],nationalPoints[i+1]]);if(p.x<0||p.y<0||p.x>w.x||p.y>w.y)continue;c.beginPath();c.arc(p.x,p.y,1.4,0,6.283);c.fill()}}m.on('moveend zoomend resize',redraw);async function national(){try{const r=await fetch('https://raw.githubusercontent.com/gpsnmeajp/nearest_pois_jp/main/japan_pois.py');if(!r.ok)throw Error(r.status);const t=await r.text();const a=t.indexOf('shrines_temples = [');const b=t.indexOf('scenic_spots = [',a);const x=t.slice(a,b);const re=/lat': ([0-9.]+), 'lon': ([0-9.]+)/g;let v;while((v=re.exec(x))){nationalPoints.push(+v[1],+v[2])}redraw();console.log('National points',nationalPoints.length/2)}catch(e){console.warn(e)}}national();</script></body></html>
