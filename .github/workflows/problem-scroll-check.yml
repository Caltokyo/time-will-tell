name: problem-scroll-check (temporary)
on: { push: { branches: [test/problem-scroll-webkit] } }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          (python3 -m http.server 8137 >/dev/null 2>&1 &)
          cd test/browser && echo '{"type":"module"}' > package.json && npm install --no-audit --no-fund playwright@1.56.0 >/dev/null 2>&1 && npx playwright install --with-deps webkit chromium >/dev/null 2>&1
          BASE=https://utaki.me/ node problem-scroll.mjs > out.txt 2>&1; rc=$?; cat out.txt; while read -r l; do echo "::notice::$l"; done < out.txt; exit $rc
